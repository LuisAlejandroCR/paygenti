<text x='950' y='300' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>• el monto lo dice ella,</text>
<text x='950' y='319' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>  no lo digita el cliente</text>
<text x='950' y='338' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>• habla: «Recibido,</text>
<text x='950' y='357' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>  40 pesos»</text>
