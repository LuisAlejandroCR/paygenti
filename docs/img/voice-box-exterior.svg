<text x='950' y='186' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>  con chulo y monto</text>
<text x='950' y='205' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'></text>
<text x='950' y='224' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='bold'>Distinto del Sono QR:</text>
<text x='950' y='243' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>• tiene un lado de la</text>
<text x='950' y='262' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>  vendedora: botón,</text>
