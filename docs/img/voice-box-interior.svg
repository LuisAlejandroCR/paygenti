<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='760' viewBox='0 0 1180 760'>
<rect width='1180' height='760' fill='#fff'/>
<text x='590.0' y='30' font-family='Helvetica,Arial,sans-serif' font-size='19' text-anchor='middle' fill='#1f2328' font-weight='bold'>Caja de voz paygent · interior (caja parada, tapa trasera abierta)</text>
<text x='198.0' y='63' font-family='Helvetica,Arial,sans-serif' font-size='14' text-anchor='middle' fill='#1f2328' font-weight='bold'>A · Pared del frente (por dentro)</text>
<rect x='60' y='75' width='276.0' height='575.0' rx='14' fill='#3a3f44' stroke='#000' stroke-width='2'/>
<rect x='140.5' y='107.19999999999999' width='114.99999999999999' height='197.79999999999998' rx='3' fill='#d1242f' stroke='#000'/>
<text x='198.0' y='203.09999999999997' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='middle' fill='#fff' font-weight='bold'>pantalla</text>
<text x='198.0' y='218.09999999999997' font-family='Helvetica,Arial,sans-serif' font-size='9.5' text-anchor='middle' fill='#fff' font-weight='normal'>pines arriba</text>
<circle cx='198.0' cy='369.4' r='39.099999999999994' fill='#fff' stroke='#2da44e' stroke-width='3'/>
<text x='198.0' y='373.4' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='middle' fill='#1f2328' font-weight='bold'>sticker NFC</text>
<circle cx='198.0' cy='523.5' r='51.74999999999999' fill='#24292f' stroke='#000'/>
<text x='198.0' y='519.5' font-family='Helvetica,Arial,sans-serif' font-size='12' text-anchor='middle' fill='#fff' font-weight='bold'>parlante</text>
<text x='198.0' y='535.5' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='middle' fill='#fff' font-weight='normal'>4 Ω 5 W</text>
<text x='198.0' y='443.0' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='middle' fill='#9be9a8' font-weight='normal'>≥ 5 cm entre NFC e imán</text>
<text x='558.0' y='63' font-family='Helvetica,Arial,sans-serif' font-size='14' text-anchor='middle' fill='#1f2328' font-weight='bold'>B · Pared de atrás (por dentro)</text>
<rect x='420' y='75' width='276.0' height='575.0' rx='14' fill='#3a3f44' stroke='#000' stroke-width='2'/>
<circle cx='558.0' cy='121.0' r='5.75' fill='#cf222e'/>
<text x='572.0' y='125.0' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='start' fill='#fff' font-weight='normal'>LED</text>
<rect x='537.3' y='141.7' width='41.4' height='32.199999999999996' rx='3' fill='#24292f' stroke='#000'/>
<text x='558.0' y='161.79999999999998' font-family='Helvetica,Arial,sans-serif' font-size='8' text-anchor='middle' fill='#f6c445' font-weight='bold'>INMP441</text>
<rect x='544.2' y='203.79999999999998' width='27.599999999999998' height='27.599999999999998' fill='#24292f' stroke='#2da44e' stroke-width='2'/>
<text x='580.0' y='221.6' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='start' fill='#fff' font-weight='normal'>botón</text>
<rect x='429.2' y='247.5' width='126.49999999999999' height='379.49999999999994' rx='3' fill='#f3efe4' stroke='#000'/>
<text x='492.45' y='434.25' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='middle' fill='#1b1f24' font-weight='bold'>protoboard 830</text>
<text x='492.45' y='449.25' font-family='Helvetica,Arial,sans-serif' font-size='9.5' text-anchor='middle' fill='#1b1f24' font-weight='normal'>MAX98357A abajo,</text>
<text x='491.3' y='479.79999999999995' font-family='Helvetica,Arial,sans-serif' font-size='9.5' text-anchor='middle' fill='#1f2328' font-weight='normal'>cerca del parlante</text>
<rect x='461.4' y='535.0' width='55.199999999999996' height='50.599999999999994' rx='3' fill='#8250df' stroke='#000'/>
<text x='489.0' y='564.3' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='middle' fill='#fff' font-weight='bold'>MAX</text>
<rect x='576.4' y='420.0' width='64.39999999999999' height='158.7' rx='3' fill='#1b1f24' stroke='#000'/>
<text x='608.6' y='496.35' font-family='Helvetica,Arial,sans-serif' font-size='11' text-anchor='middle' fill='#fff' font-weight='bold'>ESP32</text>
<text x='608.6' y='511.35' font-family='Helvetica,Arial,sans-serif' font-size='9.5' text-anchor='middle' fill='#fff' font-weight='normal'>USB abajo</text>
<rect x='571.8' y='318.79999999999995' width='55.199999999999996' height='32.199999999999996' rx='3' fill='#57606a' stroke='#000'/>
<text x='599.4' y='314.2' font-family='Helvetica,Arial,sans-serif' font-size='9.5' text-anchor='middle' fill='#fff' font-weight='normal'>interruptor</text>
<rect x='590.2' y='633.9' width='36.8' height='13.799999999999999' fill='#fff'/>
<text x='608.6' y='660.8' font-family='Helvetica,Arial,sans-serif' font-size='10' text-anchor='middle' fill='#1f2328' font-weight='normal'>salida USB-C</text>
<text x='760' y='100' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='bold'>Cómo se arma:</text>
<text x='760' y='120' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>1. Corta en el frente la ventana</text>
<text x='760' y='140' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>   (44 × 58 mm) y la rejilla.</text>
<text x='760' y='160' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>2. Pega pantalla, sticker NFC y</text>
<text x='760' y='180' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>   parlante al frente (pared A).</text>
<text x='760' y='200' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>3. Corta atrás: LED, micrófono,</text>
<text x='760' y='220' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>   botón, interruptor, USB-C.</text>
<text x='760' y='240' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>4. Pega INMP441 (orificio hacia</text>
<text x='760' y='260' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>   el agujero), botón y LED (pared B).</text>
<text x='760' y='280' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>5. Protoboard y ESP32 con cinta</text>
<text x='760' y='300' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>   doble faz en la pared B.</text>
<text x='760' y='320' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>6. Cables macho-hembra de 20 cm</text>
<text x='760' y='340' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>   entre las dos paredes: deja</text>
<text x='760' y='360' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>   holgura para abrir la caja.</text>
<text x='760' y='380' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'></text>
<text x='760' y='400' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='bold'>Ya confirmado con tu foto:</text>
<text x='760' y='420' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>• pantalla SPI con táctil XPT2046</text>
<text x='760' y='440' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>  (T_IRQ, T_DO, T_DIN, T_CS, T_CLK)</text>
<text x='760' y='460' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>• el diagrama de conexiones</text>
<text x='760' y='480' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>  sigue igual</text>
<text x='760' y='500' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>• falta ver el chip: ILI9341 o</text>
<text x='760' y='520' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>  ST7789 (lo prueba el firmware)</text>
<text x='760' y='540' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'></text>
<text x='760' y='560' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>El interruptor no se conecta</text>
<text x='760' y='580' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>por ahora: va en serie con la</text>
<text x='760' y='600' font-family='Helvetica,Arial,sans-serif' font-size='12.5' text-anchor='start' fill='#1f2328' font-weight='normal'>batería cuando la agreguemos.</text>
</svg>