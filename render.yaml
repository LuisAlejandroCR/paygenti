# render.yaml: Render blueprint for paygent — one Node web service that builds the web app and
# serves it plus the API from server/index.ts. Without PayPal keys it runs on the mock gateway.
services:
  - type: web
    name: paygent
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VENDOR_PIN
        sync: false
      - key: PASSPORT_SIGNING_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # PIN lockout keys on the caller IP. Render appends to X-Forwarded-For, so its leftmost entry
      # is forged by the client: set TRUSTED_IP_HEADER or TRUST_PROXY_HOPS once verified on Render.
      - key: TRUSTED_IP_HEADER
        sync: false
      - key: TRUST_PROXY_HOPS
        sync: false
